<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>단어장</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --surface: #1a1d24;
    --surface2: #232731;
    --line: #2f3440;
    --text: #f2f3f5;
    --sub: #a4abb8;
    --accent: #7cb6ff;
    --good: #5fd39a;
    --warn: #ffc966;
    --bad: #ff8a80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  body { overflow: hidden; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .hidden { display: none !important; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* 상단 메뉴바 */
  .bar { flex: 0 0 auto; height: 60px; display: flex; align-items: center; gap: 8px;
    padding: 0 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar .title { flex: 1; font-size: 1.3rem; font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .bar .icon-btn { width: 48px; height: 48px; border-radius: 12px; font-size: 1.8rem;
    display: grid; place-items: center; }
  .bar .icon-btn:active { background: var(--surface2); }
  .bar .count { font-size: 1.1rem; color: var(--sub); padding-right: 8px; white-space: nowrap; }

  /* 목록 */
  .list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .deck { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 22px 20px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; text-align: left; }
  .deck:active { background: var(--surface2); }
  .deck .name { font-size: 1.5rem; font-weight: 700; word-break: break-all; }
  .deck .meta { font-size: 1.05rem; color: var(--sub); white-space: nowrap; text-align: right; }
  .deck .meta b { color: var(--good); font-size: 1.3rem; }
  .deck .meta small { display: block; font-size: .85rem; margin-top: 2px; }
  .msg { color: var(--sub); font-size: 1.2rem; text-align: center; padding: 40px 16px; line-height: 1.6; }

  /* 단어장 메뉴 (외우기 / 외운 단어) */
  .mode-btn { padding: 30px 22px; border-radius: 18px; background: var(--surface);
    border: 1px solid var(--line); text-align: left; }
  .mode-btn:active { background: var(--surface2); }
  .mode-btn .t { font-size: 1.7rem; font-weight: 800; }
  .mode-btn .s { font-size: 1.15rem; color: var(--sub); margin-top: 6px; }
  .mode-btn.learn .t { color: var(--accent); }
  .mode-btn.done .t { color: var(--good); }

  /* 단어 카드 */
  .stage { flex: 1; position: relative; min-height: 0; }
  .card { position: absolute; inset: 12px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 22px; display: flex; flex-direction: column;
    overflow: hidden; touch-action: pan-y; will-change: transform; }
  .card.anim { transition: transform .22s ease, opacity .22s ease; }

  .card-top { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; z-index: 2; }
  .freq { font-size: 1.05rem; font-weight: 700; color: var(--warn); background: rgba(255,201,102,.12);
    border: 1px solid rgba(255,201,102,.35); padding: 6px 12px; border-radius: 999px; }
  .memo-btn { font-size: 1.05rem; font-weight: 700; padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--good); color: var(--good); }
  .memo-btn:active { background: rgba(95,211,154,.15); }
  .memo-btn.on { background: var(--good); color: #0f1115; }
  .memo-btn.on:active { background: #4bb884; }

  /* 위: 영단어 영역 (높이 고정 → 뜻을 열어도 움직이지 않음) */
  .head { flex: 0 0 40%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 56px 6px 12px; border-bottom: 1px solid var(--line); }
  /* 글자 크기는 JS(fitWord)가 한 줄에 맞게 자동 조절 */
  .word { width: 100%; font-size: 58px; font-weight: 800; text-align: center;
    white-space: nowrap; overflow: hidden; line-height: 1.15; letter-spacing: .01em; }
  .word.wrap { white-space: normal; word-break: break-word; overflow: visible; }
  .pron { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; min-height: 52px; }
  .ipa { font-size: 1.4rem; color: var(--sub); font-family: "Segoe UI", "Lucida Sans Unicode", "Arial Unicode MS", sans-serif; }
  .speak { width: 52px; height: 52px; border-radius: 50%; background: var(--surface2);
    border: 1px solid var(--line); display: grid; place-items: center; flex: 0 0 auto; }
  .speak:active { background: var(--line); }
  .speak svg { width: 26px; height: 26px; fill: var(--accent); }

  /* 아래: 한글 뜻 영역 */
  .body { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 20px 28px; }
  .hint { height: 100%; display: grid; place-items: center; color: #6b7280; font-size: 1.1rem; }
  .my { font-size: clamp(1.8rem, 8vw, 2.4rem); font-weight: 700; line-height: 1.35; word-break: keep-all; text-align: center; }
  .my.empty { color: var(--sub); font-size: 1.2rem; font-weight: 400; }
  .dict { margin-top: 22px; text-align: left; background: var(--bg); border-radius: 14px; padding: 16px 16px 6px; }
  .dict-label { font-size: .95rem; color: var(--sub); margin-bottom: 10px; }
  .dict-trans { font-size: 1.45rem; font-weight: 700; margin-bottom: 12px; color: var(--accent); }
  .dict-row { margin-bottom: 12px; font-size: 1.3rem; line-height: 1.45; word-break: keep-all; }
  .dict-row .pos { display: inline-block; font-size: .95rem; color: var(--bg); background: var(--sub);
    padding: 1px 8px; border-radius: 6px; margin-right: 8px; vertical-align: 2px; font-weight: 700; }

  /* 좌우 이동 화살표 (카드 위에 겹쳐서, 영단어 영역 높이에 맞춤) */
  /* 위쪽 64px은 빈도·외움 버튼 자리라 비워둠 */
  .nav { position: absolute; top: 76px; height: calc((100% - 24px) * 0.4 - 64px); width: 46px; z-index: 3;
    font-size: 2.6rem; color: var(--sub); display: grid; place-items: center; opacity: .75; }
  .nav:active { color: var(--text); opacity: 1; }
  .nav:disabled { opacity: .15; }
  .nav.prev { left: 12px; }
  .nav.next { right: 12px; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: 24px; background: #2d323d;
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; font-size: 1.15rem;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 10; }
  .toast button { color: var(--accent); font-weight: 700; font-size: 1.15rem; padding: 4px 8px; white-space: nowrap; }

  .big-btn { margin-top: 20px; padding: 14px 22px; border-radius: 14px; background: var(--surface2);
    border: 1px solid var(--line); font-size: 1.15rem; }
  .spinner { width: 36px; height: 36px; border: 4px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- 단어장 목록 -->
<section id="home" class="screen">
  <header class="bar">
    <div class="title" style="padding-left:10px">단어장</div>
    <button class="icon-btn" id="refresh" aria-label="새로고침">⟳</button>
    <button class="icon-btn" id="settings" aria-label="설정" style="font-size:1.5rem">⚙</button>
  </header>
  <div class="list" id="deckList"></div>
</section>

<!-- 단어장 메뉴 -->
<section id="deckMenu" class="screen hidden">
  <header class="bar">
    <button class="icon-btn" id="menuBack" aria-label="단어장 목록">‹</button>
    <div class="title" id="menuTitle"></div>
  </header>
  <div class="list" id="menuBody">
    <button class="mode-btn learn" id="goLearn"><div class="t">단어 외우기</div><div class="s" id="learnSub"></div></button>
    <button class="mode-btn done" id="goDone"><div class="t">외운 단어</div><div class="s" id="doneSub"></div></button>
  </div>
  <div class="msg hidden" id="menuMsg"></div>
</section>

<!-- 단어 카드 -->
<section id="study" class="screen hidden">
  <header class="bar">
    <button class="icon-btn" id="back" aria-label="뒤로">‹</button>
    <div class="title" id="deckTitle"></div>
    <div class="count" id="counter"></div>
  </header>
  <main class="stage" id="stage">
    <div class="card" id="card">
      <div class="card-top">
        <span class="freq hidden" id="freq"></span>
        <button class="memo-btn" id="memo">외움</button>
      </div>
      <div class="head">
        <div class="word" id="word"></div>
        <div class="pron">
          <span class="ipa" id="ipa"></span>
          <button class="speak" id="speak" aria-label="발음 듣기">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>
          </button>
        </div>
      </div>
      <div class="body" id="body">
        <div class="hint" id="hint">카드를 누르면 뜻이 보여요</div>
        <div class="answer hidden" id="answer">
          <div class="my" id="my"></div>
          <div class="dict hidden" id="dict"></div>
        </div>
      </div>
    </div>
    <button class="nav prev" id="prev" aria-label="이전 단어">‹</button>
    <button class="nav next" id="next" aria-label="다음 단어">›</button>
  </main>
  <div class="msg hidden" id="studyMsg"></div>
</section>

<!-- 최초 설정: Apps Script 웹앱 주소 입력 -->
<section id="setup" class="screen hidden">
  <header class="bar"><div class="title" style="padding-left:10px">처음 설정</div></header>
  <div class="list">
    <div style="font-size:1.15rem;line-height:1.6;color:var(--sub)">
      Apps Script <b style="color:var(--text)">웹 앱 URL</b>을 붙여넣으세요.<br>
      (<code>https://script.google.com/macros/s/…/exec</code>)
    </div>
    <textarea id="apiInput" rows="4" style="width:100%;font-size:1.05rem;padding:12px;border-radius:12px;background:var(--surface);color:var(--text);border:1px solid var(--line);user-select:text;-webkit-user-select:text"></textarea>
    <button class="big-btn" id="apiSave" style="background:var(--accent);color:#0f1115;font-weight:700">저장하고 시작</button>
    <div class="msg hidden" id="apiMsg" style="padding:12px"></div>
  </div>
</section>

<div class="toast hidden" id="toast"><span id="toastText"></span><button id="toastUndo">되돌리기</button></div>

<script>
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function showScreen(id) {
    ['home', 'deckMenu', 'study', 'setup'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  }

  /* ---------------- 서버(Apps Script) 호출 ---------------- */
  const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  let API_URL = (new URLSearchParams(location.search).get('api')) || store.get('apiUrl') || '';
  if (API_URL) store.set('apiUrl', API_URL);

  const API_MAP = {
    getDecks: () => ({ action: 'decks' }),
    getWords: deck => ({ action: 'words', deck }),
    setMemorized: (deck, word, on) => ({ action: 'mem', deck, word, on: on ? '1' : '0' }),
    resetMemorized: deck => ({ action: 'reset', deck }),
    getWordInfo: word => ({ action: 'info', word })
  };
  function call(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    if (IN_GAS) {
      return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
      });
    }
    const qs = new URLSearchParams(API_MAP[fn].apply(null, args)).toString();
    return fetch(API_URL + (API_URL.indexOf('?') < 0 ? '?' : '&') + qs)
      .then(r => r.text())
      .then(t => {
        let j;
        try { j = JSON.parse(t); } catch (e) { throw new Error('웹 앱 응답이 이상해요. 액세스 권한이 "모든 사용자"인지, 새 버전으로 배포했는지 확인하세요.'); }
        if (!j.ok) throw new Error(j.error || '오류');
        return j.data;
      });
  }

  /* ---------------- 최초 설정 ---------------- */
  function showSetup() { showScreen('setup'); $('apiInput').value = API_URL; }
  $('apiSave').onclick = async () => {
    const url = $('apiInput').value.trim();
    const msg = $('apiMsg');
    msg.classList.remove('hidden');
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { msg.textContent = '주소가 올바르지 않아요.'; return; }
    msg.innerHTML = '<div class="spinner"></div>연결 확인 중…';
    const prev = API_URL;
    API_URL = url;
    try {
      const decks = await call('getDecks');
      store.set('apiUrl', url);
      store.set('decks', decks);
      msg.classList.add('hidden');
      showScreen('home');
      renderDecks(decks);
    } catch (e) {
      API_URL = prev;
      msg.textContent = '연결 실패: ' + (e.message || e);
    }
  };
  $('settings').onclick = () => { if (IN_GAS) alert('Apps Script에서 직접 열린 상태예요.'); else showSetup(); };

  /* ---------------- 단어장 목록 ---------------- */
  async function loadDecks() {
    const list = $('deckList');
    const cached = store.get('decks');
    if (cached) renderDecks(cached); else list.innerHTML = '<div class="msg"><div class="spinner"></div>불러오는 중…</div>';
    try {
      const decks = await call('getDecks');
      store.set('decks', decks);
      renderDecks(decks);
    } catch (e) {
      if (!cached) list.innerHTML = '<div class="msg">불러오지 못했어요.<br>' + esc(e.message || e) + '</div>';
    }
  }
  function renderDecks(decks) {
    const list = $('deckList');
    list.innerHTML = '';
    if (!decks.length) { list.innerHTML = '<div class="msg">시트에 탭이 없어요.</div>'; return; }
    decks.forEach(d => {
      const b = document.createElement('button');
      b.className = 'deck';
      b.innerHTML = '<div class="name"></div><div class="meta"><b>' + (d.total - d.remain) + '</b> / ' + d.total + '<small>외운 단어 / 전체</small></div>';
      b.querySelector('.name').textContent = d.name;
      b.onclick = () => openDeck(d.name);
      list.appendChild(b);
    });
  }
  $('refresh').onclick = loadDecks;

  /* ---------------- 단어장 메뉴 ---------------- */
  const S = { deck: '', words: [], mem: new Set(), mode: 'learn', list: [], i: 0, open: false };

  async function openDeck(name) {
    S.deck = name; S.words = []; S.mem = new Set();
    $('menuTitle').textContent = name;
    showScreen('deckMenu');
    $('menuBody').classList.add('hidden');
    $('menuMsg').classList.remove('hidden');
    $('menuMsg').innerHTML = '<div class="spinner"></div>단어 불러오는 중…';
    try {
      const res = await call('getWords', name);
      if (S.deck !== name) return;
      S.words = res.words;
      S.mem = new Set(res.memorized);
      renderDeckMenu();
      // 첫 몇 단어 뜻/발음 미리 불러오기
      S.words.slice(0, 3).forEach(w => getInfo(w.w));
    } catch (e) {
      $('menuMsg').innerHTML = '불러오지 못했어요.<br>' + esc(e.message || e);
    }
  }
  function isMem(w) { return S.mem.has(w.w.toLowerCase()); }
  function renderDeckMenu() {
    const done = S.words.filter(isMem).length;
    $('learnSub').textContent = '남은 단어 ' + (S.words.length - done) + '개';
    $('doneSub').textContent = done + '개';
    $('menuMsg').classList.add('hidden');
    $('menuBody').classList.remove('hidden');
  }
  $('menuBack').onclick = () => { S.deck = ''; showScreen('home'); loadDecks(); };
  $('goLearn').onclick = () => startMode('learn');
  $('goDone').onclick = () => startMode('done');

  function startMode(mode) {
    S.mode = mode;
    S.list = shuffle(S.words.filter(w => mode === 'done' ? isMem(w) : !isMem(w)));
    S.i = 0;
    $('deckTitle').textContent = mode === 'done' ? '외운 단어' : S.deck;
    showScreen('study');
    render();
  }
  $('back').onclick = () => { hideToast(); showScreen('deckMenu'); renderDeckMenu(); };

  /* ---------------- 카드 ---------------- */
  function showMsg(html) {
    $('stage').classList.add('hidden');
    $('studyMsg').classList.remove('hidden');
    $('studyMsg').innerHTML = html;
    $('counter').textContent = '';
  }

  function render() {
    if (!S.list.length) {
      if (S.mode === 'done') { showMsg('아직 외운 단어가 없어요.'); return; }
      showMsg(S.words.length
        ? '🎉 이 단어장의 단어를 모두 외웠어요!<br><button class="big-btn" id="resetBtn">외운 표시 모두 지우고 다시 보기</button>'
        : '이 탭에는 단어가 없어요.');
      const r = $('resetBtn');
      if (r) r.onclick = async () => {
        showMsg('<div class="spinner"></div>초기화 중…');
        try { await call('resetMemorized', S.deck); } catch (e) {}
        S.mem = new Set();
        startMode('learn');
      };
      return;
    }
    $('studyMsg').classList.add('hidden');
    $('stage').classList.remove('hidden');
    if (S.i >= S.list.length) S.i = S.list.length - 1;
    const w = S.list[S.i];
    setOpen(false);
    $('body').scrollTop = 0;
    $('word').textContent = w.w;
    fitWord();
    $('counter').textContent = (S.i + 1) + ' / ' + S.list.length;
    $('freq').textContent = '빈도 ' + w.f;
    $('freq').classList.toggle('hidden', !w.f);
    $('my').textContent = w.m || '(시트에 적은 뜻 없음)';
    $('my').classList.toggle('empty', !w.m);
    updateMemoBtn(w);
    $('prev').disabled = S.i === 0;
    $('next').disabled = S.i === S.list.length - 1;
    $('ipa').textContent = '';
    $('dict').classList.add('hidden');
    $('dict').innerHTML = '';
    getInfo(w.w).then(info => { if (S.list[S.i] === w) renderInfo(info); });
    // 다음 2개 단어 미리 불러오기 (뜻 + 발음 음성)
    S.list.slice(S.i + 1, S.i + 3).forEach(x => getInfo(x.w));
  }

  /* 영단어를 최대한 한 줄에: 58px부터 줄여가며 맞춤, 24px로도 안 되면 두 줄 */
  const WORD_MAX = 58, WORD_MIN = 24;
  function fitWord() {
    const el = $('word');
    el.classList.remove('wrap');
    let size = WORD_MAX;
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > el.clientWidth && size > WORD_MIN) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
    if (el.scrollWidth > el.clientWidth) {
      el.classList.add('wrap');
      el.style.fontSize = '32px';
    }
  }
  window.addEventListener('resize', () => { if (!$('study').classList.contains('hidden')) fitWord(); });

  function renderInfo(info) {
    $('ipa').textContent = info.ipa || '';
    const d = $('dict');
    const rows = info.dict || [];
    if (!info.trans && !rows.length) { d.classList.add('hidden'); return; }
    let html = '<div class="dict-label">구글 번역</div>';
    if (info.trans) html += '<div class="dict-trans">' + esc(info.trans) + '</div>';
    rows.forEach(x => {
      html += '<div class="dict-row">' + (x.pos ? '<span class="pos">' + esc(x.pos) + '</span>' : '') + esc(x.terms.join(', ')) + '</div>';
    });
    d.innerHTML = html;
    d.classList.remove('hidden');
  }

  function setOpen(open) {
    S.open = open;
    $('answer').classList.toggle('hidden', !open);
    $('hint').classList.toggle('hidden', open);
  }
  let suppressClick = false;
  $('card').addEventListener('click', () => { if (!suppressClick) setOpen(!S.open); });

  /* ---------------- 뜻 / 발음기호 / 음성 (브라우저에서 직접 가져옴) ---------------- */
  const POS_KO = {
    noun: '명사', verb: '동사', adjective: '형용사', adverb: '부사', pronoun: '대명사',
    preposition: '전치사', conjunction: '접속사', interjection: '감탄사', article: '관사',
    abbreviation: '약어', prefix: '접두사', suffix: '접미사', phrase: '구', particle: '불변화사',
    'auxiliary verb': '조동사'
  };
  const INFO_VER = 2;
  const infoMem = {};
  const audioEls = {};

  function getJSON(url) {
    return fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  async function fetchInfo(word) {
    const info = { v: INFO_VER, ipa: '', audio: '', trans: '', dict: [] };
    const [tr, dic] = await Promise.allSettled([
      getJSON('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&dt=bd&dj=1&q=' + encodeURIComponent(word)),
      getJSON('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.toLowerCase()))
    ]);
    if (tr.status === 'fulfilled') {
      const j = tr.value;
      info.trans = (j.sentences || []).map(s => s.trans || '').join('').trim();
      info.dict = (j.dict || []).map(d => ({ pos: POS_KO[d.pos] || d.pos || '', terms: (d.terms || []).slice(0, 6) }))
        .filter(d => d.terms.length);
    }
    if (!info.trans && !info.dict.length) {
      // 예비: Apps Script 공식 구글 번역
      try { const r = await call('getWordInfo', word); info.trans = r.trans || ''; } catch (e) {}
    }
    if (info.trans.toLowerCase() === word.toLowerCase()) info.trans = '';
    if (dic.status === 'fulfilled' && Array.isArray(dic.value)) {
      const phs = [];
      dic.value.forEach(e => {
        if (e.phonetic) phs.push({ text: e.phonetic, audio: '' });
        (e.phonetics || []).forEach(p => phs.push({ text: p.text || '', audio: p.audio || '' }));
      });
      const withAudio = phs.find(p => /-us\.mp3$/.test(p.audio)) || phs.find(p => p.audio);
      info.audio = withAudio ? withAudio.audio : '';
      const withText = (withAudio && withAudio.text) ? withAudio : phs.find(p => p.text);
      info.ipa = withText ? withText.text : '';
    }
    return info;
  }

  function getInfo(word) {
    const k = word.toLowerCase();
    if (!infoMem[k]) {
      const saved = store.get('wi:' + k);
      if (saved && saved.v === INFO_VER) infoMem[k] = Promise.resolve(saved);
      else infoMem[k] = fetchInfo(word).then(info => {
        if (info.trans || info.dict.length) store.set('wi:' + k, info);
        else setTimeout(() => { delete infoMem[k]; }, 30000); // 실패하면 30초 뒤 다시 시도
        return info;
      });
    }
    return infoMem[k].then(info => { preloadAudio(k, info); return info; });
  }

  function preloadAudio(k, info) {
    if (!info.audio || audioEls[k]) return;
    const a = new Audio();
    a.preload = 'auto';
    a.src = info.audio;
    a.load();
    audioEls[k] = a;
  }

  /* 발음 버튼: 기다리지 않고 바로 재생 */
  let enVoice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    enVoice = vs.find(v => v.lang === 'en-US' && /google/i.test(v.name)) || vs.find(v => v.lang === 'en-US') ||
      vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  function tts(text) {
    if (!('speechSynthesis' in window)) return;
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    if (enVoice) u.voice = enVoice;
    speechSynthesis.speak(u);
  }
  $('speak').addEventListener('click', e => {
    e.stopPropagation();
    const w = S.list[S.i]; if (!w) return;
    const a = audioEls[w.w.toLowerCase()];
    if (a && a.readyState >= 3) {
      a.currentTime = 0;
      a.play().catch(() => tts(w.w));
    } else {
      tts(w.w); // 녹음 파일이 아직 준비 안 됐으면 즉시 기계음성
    }
  });

  /* ---------------- 외움 체크 ----------------
   * 누르면 체크만 켜고 끔(카드는 그대로). 체크는 바로 저장되고,
   * 단어장을 나갔다 오거나 새로고침하면 그때 '외운 단어'로 옮겨짐.
   */
  let toastTimer = null;
  function updateMemoBtn(w) {
    const on = isMem(w);
    $('memo').textContent = on ? '✓ 외움' : '외움';
    $('memo').classList.toggle('on', on);
  }
  $('memo').addEventListener('click', e => {
    e.stopPropagation();
    const w = S.list[S.i]; if (!w) return;
    const k = w.w.toLowerCase();
    const on = !S.mem.has(k);
    if (on) S.mem.add(k); else S.mem.delete(k);
    updateMemoBtn(w);
    call('setMemorized', S.deck, w.w, on).catch(() => {
      if (on) S.mem.delete(k); else S.mem.add(k);
      if (S.list[S.i] === w) updateMemoBtn(w);
      showToast('저장 실패 – 인터넷 연결을 확인하세요');
    });
  });
  function showToast(t) {
    $('toastText').textContent = t;
    $('toastUndo').classList.add('hidden');
    $('toast').classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 4000);
  }
  function hideToast() { $('toast').classList.add('hidden'); }

  /* ---------------- 이동 ---------------- */
  function go(dir) {
    const ni = S.i + dir;
    if (ni < 0 || ni >= S.list.length) { snapBack(); return; }
    animate(dir, () => { S.i = ni; render(); });
  }
  function animate(dir, then) {
    const c = $('card');
    c.classList.add('anim');
    c.style.transform = 'translateX(' + (dir > 0 ? -110 : 110) + '%)';
    c.style.opacity = '0';
    setTimeout(() => {
      c.classList.remove('anim');
      c.style.transform = 'translateX(' + (dir > 0 ? 60 : -60) + '%)';
      then();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        c.classList.add('anim');
        c.style.transform = ''; c.style.opacity = '';
      }));
    }, 180);
  }
  function snapBack() {
    const c = $('card');
    c.classList.add('anim');
    c.style.transform = ''; c.style.opacity = '';
  }
  $('prev').onclick = () => go(-1);
  $('next').onclick = () => go(1);

  /* 스와이프 */
  (function () {
    const c = $('card');
    let x0 = 0, y0 = 0, dx = 0, drag = false, tracking = false;
    c.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; drag = false; tracking = true;
      c.classList.remove('anim');
    }, { passive: true });
    c.addEventListener('touchmove', e => {
      if (!tracking) return;
      dx = e.touches[0].clientX - x0;
      const dy = e.touches[0].clientY - y0;
      if (!drag) {
        if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) drag = true;
        else if (Math.abs(dy) > 10) { tracking = false; return; }
      }
      if (drag) {
        e.preventDefault();
        c.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 40) + 'deg)';
      }
    }, { passive: false });
    c.addEventListener('touchend', () => {
      if (!tracking) return;
      tracking = false;
      if (!drag) return;
      suppressClick = true; setTimeout(() => suppressClick = false, 350);
      if (dx < -60) go(1); else if (dx > 60) go(-1); else snapBack();
    });
    // PC 마우스 드래그
    let md = false, mx = 0;
    c.addEventListener('mousedown', e => { md = true; mx = e.clientX; dx = 0; c.classList.remove('anim'); });
    window.addEventListener('mousemove', e => {
      if (!md) return; dx = e.clientX - mx;
      if (Math.abs(dx) > 10) c.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 40) + 'deg)';
    });
    window.addEventListener('mouseup', () => {
      if (!md) return; md = false;
      if (Math.abs(dx) > 10) { suppressClick = true; setTimeout(() => suppressClick = false, 350); }
      if (dx < -60) go(1); else if (dx > 60) go(-1); else snapBack();
    });
  })();

  /* 키보드 (PC 테스트용) */
  document.addEventListener('keydown', e => {
    if ($('study').classList.contains('hidden')) return;
    if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === ' ') setOpen(!S.open);
  });

  /* 시작 */
  if (IN_GAS || API_URL) loadDecks(); else showSetup();
  if (!IN_GAS && 'serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
